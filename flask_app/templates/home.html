<!DOCTYPE html>
<html>
<head>
    <title>LiamGas - Real-Time Community Chat Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3967455593918125"
     crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .seo-content {
            margin-top: 50px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: 0.9em;
            line-height: 1.6;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 0.8em;
        }
        .footer a {
            color: #888;
            margin: 0 10px;
            text-decoration: none;
        }
        .footer a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='images/home.png') }}" alt="Home"></a>
            <a href="{{ url_for('chat_rooms') }}"><img src="{{ url_for('static', filename='images/textbubble.png') }}" alt="Chat"></a>
            <a href="{{ url_for('gas') }}"><img src="{{ url_for('static', filename='images/gas.png') }}" alt="Gas"></a>
        </div>
        <div class="main-content">
            <h1>Welcome to LiamGas</h1>
            <marquee>harlanisabarlan and ima tarlan</marquee>
            <p>unc knows html :speedface:</p>
            <button onclick="gasup()">gas up</button>
            <img id="car" style="position: absolute; left: 300px; top:420px; pointer-events: none;" src="{{ url_for('static', filename='car.png') }}">
    </div>
    <script>
        let animationInterval
        function gasup() {
            if (animationInterval) clearInterval(animationInterval)
            let car = document.getElementById("car")
            let left = 300
            animationInterval = setInterval(() => {
                left -= 10
                car.style.left = left + "px"
            }, 50)
        }
    </script>
</body>
</html>
