<!DOCTYPE html>
<html>
<head>
    <title>{{ room.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }
        .own .profile-pic {
            margin-right: 0;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ room.name }}</h1>
        <a href="{{ url_for('chat_rooms') }}" class="back">Back to Rooms</a>
        <div id="status" class="status">Connecting...</div>
        <div class="messages" id="messages">
            {% for message in messages %}
            <div class="message {% if message.author.username == current_user.username %}own{% else %}other{% endif %}">
                {% if message.author.profile_pic_url %}
                    <img src="{{ message.author.profile_pic_url }}" class="profile-pic" alt="{{ message.author.username }}">
                {% else %}
                    <div class="no-avatar">{{ message.author.username[0].upper() }}</div>
                {% endif %}
                <div class="message-content">
                    <strong>{{ message.author.username }}</strong>: {{ message.content }}
                    <div class="timestamp">{{ message.timestamp.strftime('%b %d, %H:%M') }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
        <form id="messageForm">
            <input type="text" id="messageInput" placeholder="Type your message..." required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const roomId = {{ room.id }};
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const messageForm = document.getElementById('messageForm');
        const statusDiv = document.getElementById('status');
        let lastMessageId = 0;

        // Get initial messages
        {% for message in messages %}
        lastMessageId = Math.max(lastMessageId, {{ message.id }});
        {% endfor %}

        statusDiv.textContent = 'Connected - Real-time chat active!';
        statusDiv.style.background = '#d4edda';

        // Poll for new messages every 2 seconds
        setInterval(fetchNewMessages, 2000);

        function fetchNewMessages() {
            fetch(`/chat/${roomId}/messages/?after=${lastMessageId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(message => {
                            if (message.id > lastMessageId) {
                                addMessageToUI(message);
                                lastMessageId = Math.max(lastMessageId, message.id);
                            }
                        });
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                })
                .catch(error => {
                    console.error('Error fetching messages:', error);
                    statusDiv.textContent = 'Connection issue - messages may be delayed';
                    statusDiv.style.background = '#fff3cd';
                });
        }

        function addMessageToUI(message) {
            const messageDiv = document.createElement('div');
            const isOwnMessage = message.user === '{{ current_user.username }}';

            messageDiv.className = `message ${isOwnMessage ? 'own' : 'other'}`;
            
            let avatarHtml = '';
            if (message.profile_picture) {
                avatarHtml = `<img src="${message.profile_picture}" class="profile-pic" alt="${message.user}">`;
            } else {
                avatarHtml = `<div class="no-avatar">${message.user.charAt(0).toUpperCase()}</div>`;
            }

            messageDiv.innerHTML = `
                ${avatarHtml}
                <div class="message-content">
                    <strong>${message.user}</strong>: ${message.content}
                    <div class="timestamp">${new Date(message.timestamp).toLocaleString()}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
        }

        messageForm.onsubmit = function(e) {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (message) {
                fetch(`/chat/${roomId}/send/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `content=${encodeURIComponent(message)}`
                })
                .then(response => {
                    if (response.ok) {
                        messageInput.value = '';
                        fetchNewMessages(); // Fetch immediately so user sees it faster
                    } else {
                        alert('Error sending message');
                    }
                })
                .catch(error => {
                    console.error('Error sending message:', error);
                    alert('Error sending message');
                });
            }
        };

        // Auto-scroll to bottom on load
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    </script>
</body>
</html>
