<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 400px; margin: 0 auto; }
        form { margin: 20px 0; }
        input { width: 100%; padding: 10px; margin: 5px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; width: 100%; }
        .back { background: #6c757d; margin-top: 10px; }
        .errorlist { color: red; list-style: none; padding: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <form method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <p style="color: red;">{{ messages[0] }}</p>
        {% endif %}
        {% endwith %}
        <a href="{{ url_for('home') }}" class="back">Back to Home</a>
    </div>
</body>
</html>
