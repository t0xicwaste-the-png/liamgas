<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 400px; margin: 0 auto; }
        form { margin: 20px 0; }
        input { width: 100%; padding: 10px; margin: 5px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; width: 100%; }
        .back { background: #6c757d; margin-top: 10px; }
        .errorlist { color: red; list-style: none; padding: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        {% if form.errors %}
        <p>Please correct the errors below.</p>
        {% endif %}
        <a href="{% url 'home' %}" class="back">Back to Home</a>
    </div>
</body>
</html></content>
